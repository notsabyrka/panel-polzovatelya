<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель пользователя</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <div class="user-panel">
      <div class="user-panel__main">
        <img
          class="user-panel__image"
          src="./img/avatar.jpg"
          alt="Илья Морозов"
          width="72" height="72"
        >
        <div class="user-panel__info">
          <div class="user-panel__name">Илья Морозов</div>
          <div class="user-panel__role">Motion Designer</div>
        </div>
      </div>
      <div class="user-panel__extra">
        <div class="user-panel__status">В сети</div>
        <button class="user-panel__button" type="button">Открыть профиль</button>
      </div>
    </div>
  </body>
</html>
